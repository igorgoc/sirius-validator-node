version: '3.8'

services:
  validator-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: sirius-validator-node:latest
    container_name: sirius-validator-${NODE_NAME:-node1}
    restart: unless-stopped
    env_file:
      - ./config/node.env
    # Note: Do NOT override secrets (SIRIUS_VM_AUTH_TOKEN, SIRIUS_VALIDATOR_PRIVATE_KEY)
    # with empty defaults here — let ./config/node.env supply them directly.
    ports:
      - "${NODE_PORT:-5051}:5051"
    volumes:
      - ./data:/app/data
      - ./cluster:/app/cluster
      - ./contracts:/app/contracts:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
